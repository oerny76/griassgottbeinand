<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup: Termine verwalten und vorab abmelden</title>
<style>/* Kopie der App-Styles (styles.css), damit der Mockup allein lauffähig ist */
/* Farben und Formen für die Mitglieder-App. Hell und Dunkel folgen dem Gerät. */
:root {
  --bg: #f6efe2; --card: #ffffff; --ink: #1d2a25; --muted: #5f6b65; --line: #e6dfd0;
  --brand: #1f6f5c; --brand-ink: #ffffff; --accent: #f4c542; --warn: #b4452f; --ok: #2c7a4b;
  --hero: #1f5c4a; --wash: #d9e8e1;
  --radius: 20px; --shadow: 0 1px 0 var(--line), 0 6px 18px rgba(60, 40, 10, .06);
  --tabbar-h: 64px;
  --s1: #1f8a70; --s2: #e8a200; --s3: #e2573d; --s4: #6b5bd2; --grid: #e6dfd0; --seq-hi: #1f6f5c; --seq-lo: #e4efe9; --seq-ink: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1a17; --card: #17261f; --ink: #ecf1ee; --muted: #9fb0a8; --line: #26382f; --brand: #3fae93; --brand-ink: #06231b; --warn: #ff8a73; --ok: #6fcf97; --hero: #1f5c4a; --wash: #213a31; --shadow: none; --s1: #22a479; --s2: #b78a0b; --s3: #c65959; --s4: #7971d0; --grid: #26382f; --seq-hi: #3fae93; --seq-lo: #1d3128; --seq-ink: #06231b; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
#app { max-width: 520px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); }
h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em; margin: 2px 0 14px; }
h2 { font-size: .8rem; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.hello { color: var(--muted); margin: 0; font-size: .9rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin: 0 0 12px; box-shadow: var(--shadow); }
.big { font-size: 1.25rem; font-weight: 700; margin: 0 0 4px; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.center { text-align: center; }
.pad { padding: 32px 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.stack > * + * { margin-top: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.chip { background: color-mix(in srgb, var(--brand) 14%, transparent); border-radius: 999px; padding: 3px 10px; font-size: .875rem; }
.chip.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); font-weight: 600; }
button, .btn { font: inherit; font-weight: 600; min-height: 48px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
button.primary, .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
button.paypal, .btn.paypal { background: var(--accent); border-color: var(--accent); color: #2a2200; }
button.link { min-height: 0; padding: 4px 8px; border: 0; background: transparent; color: var(--brand); font-weight: 600; }
button.full, .btn.full { width: 100%; }
button:disabled { opacity: .55; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input, select, textarea { font: inherit; width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
label { display: block; font-size: .875rem; color: var(--muted); margin: 0 0 4px; }
.inline { display: flex; gap: 8px; }
.inline > input { flex: 1; }
a { color: var(--brand); }
details > summary { cursor: pointer; font-weight: 600; min-height: 32px; }
.notice { border-left: 4px solid var(--accent); padding: 8px 12px; background: color-mix(in srgb, var(--accent) 16%, transparent); border-radius: 8px; font-size: .9rem; }
.total { font-size: 1.6rem; font-weight: 800; }
.total.zero { color: var(--ok); }
#toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translate(-50%, 20px); max-width: min(92vw, 480px); padding: 12px 16px; border-radius: 12px; background: #23302b; color: #fff; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 10; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.err { background: #8c2f1d; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
.bar { display: block; height: 4px; margin-top: 4px; border-radius: 2px; background: var(--brand); opacity: .55; }
.rate { font-weight: 700; white-space: nowrap; color: var(--brand); }
.stars { color: var(--accent); letter-spacing: 1px; }
details.loc > summary { list-style: none; min-height: 40px; }
details.loc > summary::-webkit-details-marker { display: none; }
details.loc { border-bottom: 1px solid var(--line); }
details.loc > summary { font-weight: 400; }

/* ---------- iOS Safari: Datumsfelder ignorieren sonst Breite und Höhe ---------- */
input[type="date"] {
  -webkit-appearance: none;
  appearance: none;
  display: block;
  box-sizing: border-box;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  height: 48px;
  line-height: 1.2;
  text-align: left;
}
input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0; min-height: 1.2em; }
.inline > input[type="date"] { flex: 1 1 0; width: auto; }

/* ---------- Vorsitz: Auswahl mit Vorschlag ---------- */
.picklist { display: flex; flex-direction: column; gap: 6px; max-height: 340px; overflow-y: auto; }
.pick { display: flex; align-items: center; gap: 10px; margin: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; color: var(--ink); cursor: pointer; font-size: 1rem; }
.pick:has(input:checked) { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 10%, transparent); }
.pick input[type="radio"] { width: 22px; min-height: 22px; height: 22px; margin: 0; flex: 0 0 22px; accent-color: var(--brand); }
.pickbody { display: flex; flex-direction: column; min-width: 0; }

/* ---------- Redesign: Startseite mit Hauptkarte und Kacheln ---------- */
#app.tabs { padding-bottom: calc(var(--tabbar-h) + max(24px, env(safe-area-inset-bottom))); }
.hero { position: relative; overflow: hidden; margin: 0 0 12px; padding: 20px; border-radius: 24px; background: var(--hero); color: #fff; }
.hero::before { content: ""; position: absolute; inset: 0; opacity: .12; pointer-events: none;
  background: linear-gradient(45deg, #fff 25%, transparent 25%) 0 0 / 34px 34px, linear-gradient(-45deg, #fff 25%, transparent 25%) 0 0 / 34px 34px;
  -webkit-mask-image: linear-gradient(180deg, transparent 20%, #000 100%); mask-image: linear-gradient(180deg, transparent 20%, #000 100%); }
.hero > * { position: relative; margin: 0; }
.hero > * + * { margin-top: 6px; }
.hero a { color: #fff; }
.hero .muted { color: rgba(255, 255, 255, .8); }
.hero .when { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: .8rem; font-weight: 700; background: var(--accent); color: #2a2200; }
.hero > .headcount { position: absolute; top: 14px; right: 14px; margin: 0; min-width: 84px; padding: 8px 14px; border-radius: 18px; background: var(--accent); color: #2a2200; text-align: center; display: flex; flex-direction: column; line-height: 1.1; }
.hero .headcount strong { font-size: 2.6rem; font-weight: 800; line-height: 1; }
.hero .headcount span { font-size: .75rem; font-weight: 700; }
.hero .headcount small { font-size: .7rem; font-weight: 600; margin-top: 2px; padding-top: 3px; border-top: 1px solid rgba(42, 34, 0, .25); }
.hero .date { font-size: 2.1rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.08; margin-top: 10px; }
.hero .date small { display: block; font-size: 1.1rem; font-weight: 600; letter-spacing: 0; opacity: .85; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-width: 0; box-shadow: var(--shadow); }
.tile.wide { grid-column: span 2; }
.tile p { margin: 0; }
.tile .label { color: var(--muted); font-size: .8125rem; }
.tile .num { font-size: 1.75rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; overflow-wrap: anywhere; }
.tile .num.zero { color: var(--ok); }
.tile .num.text { font-size: 1.2rem; }
.tile .btn { margin-top: 10px; }
.tile.tap { cursor: pointer; text-align: left; font-weight: 400; min-height: 0; display: block; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--card); border-top: 1px solid var(--line); padding: 0 max(8px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(8px, env(safe-area-inset-left)); }
.tabbar-in { max-width: 520px; margin: 0 auto; display: flex; justify-content: space-around; }
.tabbar button, .tabbar a { display: flex; align-items: center; justify-content: center; text-decoration: none; flex: 1 1 0; min-height: var(--tabbar-h); flex-direction: column; gap: 3px; border: 0; border-radius: 0; background: transparent; color: var(--muted); font-size: .72rem; font-weight: 600; padding: 8px 4px; }
.tabbar button[aria-current="page"] { color: var(--brand); }
.tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
body:has(.tabbar) #toast { bottom: calc(var(--tabbar-h) + max(20px, env(safe-area-inset-bottom))); }

/* ---------- Statistik: Diagramme (Farben in Hell und Dunkel geprüft, siehe docs/REDESIGN-KONZEPT.md) ---------- */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 12px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px; min-width: 0; box-shadow: var(--shadow); }
.kpi p { margin: 0; }
.kpi .label { color: var(--muted); font-size: .75rem; line-height: 1.25; }
.kpi .v { white-space: nowrap; font-size: 1.15rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; margin: 2px 0; }
.chartcard h3 { margin: 0; font-size: 1rem; font-weight: 800; letter-spacing: -.01em; }
.chartcard .head { margin-bottom: 8px; }
.chartcard .ctl { margin: 0 0 8px; }
.seg { display: inline-flex; flex: 0 0 auto; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.seg button { min-height: 32px; padding: 2px 10px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-size: .75rem; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .8125rem; color: var(--muted); margin: 0 0 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.ch { display: block; overflow: visible; touch-action: pan-y; }
.ch .t { font-size: 10px; }
.ch .t.strong { font-weight: 700; font-size: 11px; }
.ch .t.muted { fill: var(--muted); }
.ch .t.ink { fill: var(--ink); }
.ch .t.name, .ch .t.name.strong { font-size: 11px; }
.ch .t.dark { fill: #2a2200; }
.ch .t.onseq { fill: var(--seq-ink); }
.ch .t.small9 { font-size: 9px; }
.ch .grid { stroke: var(--grid); stroke-width: 1; }
.ch .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ch .dot { stroke: var(--card); stroke-width: 2; }
.ch .cross { stroke: var(--muted); stroke-width: 1; }
.ch .hit { fill: transparent; outline: none; }
.ch .hit:hover, .ch .hit:focus { fill: color-mix(in srgb, var(--ink) 8%, transparent); }
.ch .hit:focus-visible { stroke: var(--accent); stroke-width: 2; }
button.linkbtn { min-height: 36px; padding: 4px 0; border: 0; background: transparent; color: var(--muted); font-size: .8125rem; font-weight: 600; text-decoration: underline; }
.tvwrap { max-height: 260px; overflow: auto; margin-top: 6px; }
table.tv { width: 100%; border-collapse: collapse; font-size: .8125rem; }
table.tv th, table.tv td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); font-weight: 400; }
table.tv thead th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--card); }
#charttip { position: fixed; z-index: 20; pointer-events: none; max-width: 230px; padding: 8px 10px; border-radius: 10px; font-size: .8125rem; line-height: 1.35; background: var(--ink); color: var(--bg); box-shadow: 0 6px 20px rgba(0, 0, 0, .3); opacity: 0; transition: opacity .1s; }
#charttip.on { opacity: 1; }
#charttip strong { display: block; font-size: .9375rem; }
@media (prefers-reduced-motion: reduce) { #charttip { transition: none; } }
.tile .unit { font-size: 1rem; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.tile .sep { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
.tile .trend { display: flex; align-items: center; gap: 12px; }
.tile .bubble { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 44px; width: 44px; height: 44px; border-radius: 50%; background: var(--wash); color: var(--ink); }
.tile .arrow { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.tile .arrow.a-up { transform: rotate(-35deg); }
.tile .arrow.a-down { transform: rotate(35deg); }

/* ---------- Aktionen direkt in der Hauptkarte ---------- */
.hero .badges { display: flex; flex-wrap: wrap; gap: 6px; }
.hero .state { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: .8rem; font-weight: 700; background: rgba(255, 255, 255, .2); color: #fff; }
.hero .locLinks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.hero .locLinks .hbtn { min-height: 40px; padding: 6px 12px; font-size: .9rem; }
.rateRow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.starset { display: inline-flex; gap: 2px; }
.starbtn { min-height: 40px; min-width: 40px; padding: 0; border: 0; background: transparent; font-size: 1.5rem; line-height: 1; color: var(--accent); }
.hero .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.hero .hbtn { flex: 1 1 auto; min-height: 46px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, .6); background: transparent; color: #fff; padding: 8px 14px; }
.hero .hbtn.main { background: #fff; border-color: #fff; color: #1f5c4a; }
.hero .hbtn[aria-expanded="true"] { background: rgba(255, 255, 255, .22); }
.hero .hbtn:focus-visible { outline-color: var(--accent); }
.hero .panel { margin-top: 12px; padding: 14px; border-radius: 16px; background: var(--card); color: var(--ink); }
.hero .panel .muted { color: var(--muted); }
.hero .panel a { color: var(--brand); }

/* Bierdeckel: schwebender Knopf unten rechts und Overlay */
.dk-fab { --filz: #f3e6c8; --filz-line: #b8975a; --filz-ink: #3a2a14; position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom)); z-index: 7; width: 64px; height: 64px; min-height: 0; padding: 0; border-radius: 50%; background: transparent; border: 0; color: #3a2a14; box-shadow: 0 4px 14px rgba(0, 0, 0, .28); }
.dk-fab[hidden], .dk-back[hidden], .dk-badge[hidden] { display: none; }
.dk-ico, .dk-ico > svg { display: block; width: 100%; height: 100%; }
.dk-filz { fill: var(--filz, #f3e6c8); stroke: var(--filz-line, #b8975a); stroke-width: 2; }
.dk-ring { fill: none; stroke: var(--filz-line, #b8975a); stroke-width: 1; stroke-dasharray: 2 3; }
.dk-str { fill: none; stroke: var(--filz-ink, #3a2a14); stroke-width: 3.4; stroke-linecap: round; }
.dk-plus { position: absolute; right: -4px; bottom: -4px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); box-shadow: 0 1px 4px rgba(0, 0, 0, .3); display: grid; place-items: center; }
.dk-plus svg { width: 14px; height: 14px; fill: none; stroke: #2a2200; stroke-width: 2.4; stroke-linecap: round; }
.dk-medal { position: absolute; left: 50%; top: -38px; width: 76px; height: 76px; transform: translateX(-50%); --filz: #f3e6c8; --filz-line: #b8975a; color: #3a2a14; }
.dk-medal svg { display: block; width: 100%; height: 100%; }
.dk-medal .dk-in { fill: #f3e6c8; }
.dk-medal text { fill: #3a2a14; }
.dk-tally { display: inline-block; margin-left: 8px; vertical-align: -3px; color: var(--muted); }
.dk-badge { position: absolute; top: -4px; right: -4px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--brand); color: var(--brand-ink); font-size: .75rem; font-weight: 700; line-height: 22px; text-align: center; }
.dk-back { position: fixed; inset: 0; z-index: 9; background: rgba(0, 0, 0, .45); display: flex; align-items: flex-end; justify-content: center; }
.dk-sheet { width: 100%; max-width: 520px; max-height: 90vh; max-height: 90dvh; display: flex; flex-direction: column; background: var(--bg); border-radius: var(--radius) var(--radius) 0 0; box-shadow: 0 -6px 24px rgba(0, 0, 0, .25); }
.dk-sheet { position: relative; }
.dk-head { display: flex; align-items: center; justify-content: flex-end; min-height: 52px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.dk-body { overflow-y: auto; overscroll-behavior: contain; padding: 16px 16px max(24px, env(safe-area-inset-bottom)); }
.dk-body .card:last-child { margin-bottom: 0; }
@media (prefers-reduced-motion: no-preference) { .dk-sheet { animation: dk-up .18s ease-out; } @keyframes dk-up { from { transform: translateY(24px); opacity: 0; } } }
.dk-body .chip { min-height: 40px; padding: 6px 12px; }
.dk-sticky { position: sticky; bottom: 0; margin: 12px -16px 0; padding: 10px 16px 12px; background: var(--card); border-top: 1px solid var(--line); }

/* Stammtischausflug */
.trip-banner { display: flex; align-items: center; gap: 12px; width: 100%; margin: 0 0 12px; padding: 14px 16px; border: 0; border-radius: 20px; background: var(--accent); color: #2a2200; text-align: left; font: inherit; cursor: pointer; }
.trip-banner .trip-emoji { font-size: 1.8rem; line-height: 1; }
.trip-banner .trip-text { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.trip-banner .trip-text strong { font-size: 1.05rem; }
.trip-banner .trip-text { min-width: 0; }
.trip-banner .trip-text strong, .trip-banner .trip-text span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trip-banner .trip-text span { font-size: .85rem; }
.trip-banner .trip-go { font-size: 1.8rem; line-height: 1; }
.trip-row { display: flex; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.trip-row:first-of-type { border-top: 0; }
.trip-time { flex: 0 0 3.2rem; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--brand); }
.trip-row.off { opacity: .45; }
.trip-row.off .trip-time { color: var(--muted); }
.stack[hidden], p[hidden] { display: none; }

/* Abstimmungen */
textarea { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical; }
textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tabbar button { position: relative; padding-left: 2px; padding-right: 2px; }
.tab-badge { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--warn); color: #fff; font-size: .7rem; line-height: 18px; text-align: center; }
.motion-bar { display: flex; gap: 8px; margin: 0 0 14px; }
.motion-bar input { flex: 1 1 auto; min-width: 0; }
.motion-bar button { flex: 0 0 auto; white-space: nowrap; }
button.motion { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; width: 100%; text-align: left; margin: 0 0 10px; padding: 14px 16px; border-radius: var(--radius); font-weight: 400; box-shadow: var(--shadow); }
button.motion strong { font-weight: 700; }
.motion-archive { margin-top: 14px; }
.motion-archive summary { cursor: pointer; font-weight: 700; color: var(--muted); padding: 8px 0 12px; }
.motion-vote { display: flex; flex-direction: column; gap: 8px; }
.tile-vote { border-color: var(--warn); border-width: 2px; }
.tile-vote .num { color: var(--warn); }

/* Anträge: Balken, Ring, Zeitleiste, Urteil */
button.motion { gap: 10px; border-left-width: 1px; }
button.motion.done { border-left: 6px solid var(--muted); }
button.motion.done.accepted { border-left-color: var(--ok); }
button.motion.done.rejected { border-left-color: var(--warn); }
.motion-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; width: 100%; }
.motion-title { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ring { --p: 0%; flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--brand) var(--p), var(--line) 0); }
.ring span { width: 36px; height: 36px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-size: .72rem; font-weight: 700; }
.tally, .majority { display: flex; width: 100%; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line); }

      const mine = isAbsent(m.date), g = guests[m.date] || 0, ch = chair[m.date], isChair = ch === ME;
      return h("div", { class: "mt" },
        h("div", { class: "d" }, fmt(m.date, { weekday: "short", day: "numeric", month: "long" }), h("small", {}, m.date.slice(0, 4) !== TODAY.slice(0, 4) ? " " + m.date.slice(0, 4) : "")),
        h("div", { class: "count", role: "group", "aria-label": `${count(m.date)} Teilnehmer` }, h("strong", {}, count(m.date)), h("span", {}, "dabei")),
        h("div", { class: "meta" },
          h("span", {}, when(days(m.date))),
          m.moved ? h("span", { class: "tag moved", title: `Regulär: ${long(m.reg)}` }, "verschoben") : null,
          h("span", {}, ch ? `Vorsitz ${ch === ME ? "ich" : ch}` : "Vorsitz offen"),
          g ? h("span", {}, `inkl. ${g} Gast`) : null,
          (absent[m.date] || []).length ? h("span", {}, `${(absent[m.date] || []).length} abgemeldet`) : null),
        m.moved ? h("p", { class: "muted small who2" }, `Regulär wäre ${short(m.reg)}.`) : null,
        h("div", { class: "act" },
          mine ? h("span", { class: "tag out" }, "Du bist abgemeldet") : null,
          isChair && !mine ? h("span", { class: "muted small" }, "Du hast den Vorsitz. Zum Abmelden zuerst übertragen.")
            : h("button", { type: "button", "aria-label": `${mine ? "Doch teilnehmen am" : "Abmelden für"} ${short(m.date)}`, onclick: () => toggleAbsent(m.date) }, mine ? "Doch teilnehmen" : "Ich komme nicht")));
    }),
    h("p", { class: "muted small", style: "margin:4px 0 12px" }, "Abmelden geht bis 19 Uhr am jeweiligen Stammtischtag. Gebucht wird mit dem Datum des Termins."));
  return det;
}

function adminView() {
  const rows = []; let y = 2026, m = 11;
  for (let i = 0; i < 6; i++) { rows.push(meetingFor(y, m)); if (++m > 12) { m = 1; y++; } }
  const seg = h("div", { class: "seg", role: "tablist" }, ["Zahlung", "Buchen", "Offen", "Letzte", "Termine"].map((l) => h("button", { class: l === "Termine" ? "primary" : "", role: "tab", "aria-selected": String(l === "Termine"), onclick: () => l !== "Termine" && toast("(im Mockup nicht belegt)") }, l)));
  return h("div", {}, h("h1", {}, "Admin"), h("p", { class: "muted small", style: "margin:0 0 12px" }, "Nur du kannst hier buchen und verwalten."), seg,
    h("section", { class: "card" }, h("h2", {}, "Stammtisch-Termine"),
      h("p", { class: "muted small", style: "margin:0 0 6px" }, "Regel: immer der erste Freitag im Monat. Abweichungen hinterlegst du hier."),
      rows.map((r) => {
        const open = view === "move" && editKey === r.key;
        return h("div", { class: "adm" },
          h("div", { class: "top" },
            h("div", {}, h("div", { class: "m" }, fmt(r.date, { month: "long", year: "numeric" })),
              h("div", { class: "dt" }, short(r.date), " ", r.moved ? h("span", { class: "tag moved" }, "verschoben") : h("span", { class: "tag" }, "regulär")),
              r.moved ? h("div", { class: "muted small" }, `Regulär: ${short(r.reg)}`) : null,
              h("div", { class: "muted small" }, `${count(r.date)} Teilnehmer · ${(absent[r.date] || []).length} abgemeldet`)),
            h("button", { type: "button", "aria-expanded": String(open), onclick: () => { if (open) { view = "admin"; } else { view = "move"; editKey = r.key; editDate = r.date; } render(); } }, open ? "Schließen" : "Verschieben")),
          open ? movePanel(r) : null);
      })));
}

function movePanel(r) {
  const [yy, mm] = r.key.split("-").map(Number);
  const out = h("div", { class: "stack", style: "margin-top:10px" });
  const input = h("input", { id: "nd", type: "date", value: editDate });
  const save = h("button", { type: "button", class: "primary full" }, "Termin speichern");
  const reset = h("button", { type: "button", class: "full", disabled: !r.moved }, "Auf regulär zurücksetzen");
  const check = () => {
    const v = input.value, msgs = []; let block = false;
    if (!v) { block = true; msgs.push(["warn-t", "Bitte ein Datum wählen."]); }
    else {
      if (v < TODAY) { block = true; msgs.push(["warn-t", "Das Datum liegt in der Vergangenheit."]); }
      if (v.slice(0, 7) !== r.key) { block = true; msgs.push(["warn-t", `Der Termin muss im ${fmt(r.reg, { month: "long" })} bleiben. Für einen anderen Monat bitte dort verschieben.`]); }
      if (!block && dt(v).getDay() !== 5) msgs.push(["warn-t", `Achtung: ${fmt(v, { weekday: "long" })}, kein Freitag. Das ist erlaubt.`]);
      if (!block && v === r.date) { block = true; msgs.push(["muted small", "Das ist schon der aktuelle Termin."]); }
      if (!block && v === r.reg) msgs.push(["ok-t", "Das ist der reguläre Termin (erster Freitag). Die Abweichung entfällt."]);
      if (!block && (absent[r.date] || []).length) msgs.push(["muted small", `${absent[r.date].length} schon eingetragene Abmeldung(en) wandern auf das neue Datum mit.`]);
    }
    out.replaceChildren(...msgs.map(([c, t]) => h("p", { class: c.includes("small") ? c : c + " small", style: "margin:0" }, t)));
    save.disabled = block; editDate = v;
  };
  input.addEventListener("input", check);
  save.addEventListener("click", () => {
    if (editDate === r.reg) delete overrides[r.key]; else overrides[r.key] = editDate;
    if (absent[r.date] && absent[r.date] !== absent[editDate]) { absent[editDate] = absent[r.date]; if (editDate !== r.date) delete absent[r.date]; }
    toast(`Termin gespeichert: ${short(editDate)}.${notify ? " Mitglieder werden benachrichtigt." : ""}`);
    view = "admin"; render();
  });
  reset.addEventListener("click", () => { delete overrides[r.key]; const old = r.date; if (absent[old]) { absent[r.reg] = absent[old]; delete absent[old]; } toast(`Zurückgesetzt auf ${short(r.reg)}.`); view = "admin"; render(); });
  const chk = h("label", { class: "chk" }, h("input", { type: "checkbox", checked: notify, onchange: (e) => (notify = e.target.checked) }), "Mitglieder per Push über die Änderung informieren");
  setTimeout(check, 0);
  return h("div", { class: "panel" },
    h("label", { for: "nd" }, `Neues Datum für ${fmt(r.reg, { month: "long", year: "numeric" })}`), input,
    h("p", { class: "muted small", style: "margin:6px 0 0" }, `Regulär: ${long(r.reg)}`), out, chk,
    h("div", { class: "btnrow" }, reset, save));
}

/* ---------- Seiten ---------- */
function tabbar(active) {
  const t = [["start", "🏠", "Start"], ["x", "📊", "Statistik"], ["y", "💶", "Konto"], ["admin", "🔒", "Admin"]];
  return h("nav", { class: "tabbar-mock", "aria-label": "Bereiche" }, t.map(([id, i, l]) => h("span", { class: (id === active || (id === "admin" && view === "move" && active === "admin")) ? "on" : "", onclick: () => { if (id === "start" || id === "admin") go(id); } }, h("i", {}, i), l)));
}
function render() {
  const ph = document.getElementById("phone");
  const isAdmin = view === "admin" || view === "move";
  ph.replaceChildren(
    isAdmin ? adminView() : h("div", {}, h("p", { class: "hello" }, "Samstag, 10. Oktober"), h("h1", {}, "Servus, " + ME), heroCard(), upcomingCard()),
    tabbar(isAdmin ? "admin" : "start"));
  document.querySelectorAll(".selector button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.go === view)));
  document.getElementById("legend").replaceChildren(...legends[view].map((t) => { const li = document.createElement("li"); li.innerHTML = t; return li; }));
}
function go(v) { view = v; if (v === "move") { editKey = "2027-01"; editDate = meetingFor(2027, 1).date; } render(); }
document.querySelectorAll(".selector button").forEach((b) => b.addEventListener("click", () => go(b.dataset.go)));
render();
</script>
</body>
</html>
