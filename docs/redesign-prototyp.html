/* ===== Tooltip (nur textContent, nie innerHTML) ===== */

const W = 342;

  const m = el.className.match(/t-\w+/); document.body.style.background = view === "B" || (view === "S" && stat) ? "#0b1210" : "#d9d6cf";
  const t = getComputedStyle(ph); document.getElementById("tip").style.setProperty("--tipbg", t.getPropertyValue("--tipbg")); document.getElementById("tip").style.setProperty("--tipink", t.getPropertyValue("--tipink"));
}
document.querySelectorAll(".selector button").forEach((b) => b.addEventListener("click", () => { view = b.dataset.v; render(); window.scrollTo(0, 0); }));
const q = new URLSearchParams(location.search); if (q.get("v")) view = q.get("v"); if (q.get("dark")) stat = true;
render();
</script>
